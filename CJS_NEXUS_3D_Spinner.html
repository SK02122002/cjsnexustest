<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CJS Nexus Spinner</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 35%,#12345a,#050912 62%,#02040a);font-family:Arial,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.app{text-align:center;width:min(94vw,650px)}h1{font-size:clamp(25px,6vw,48px);margin:0 0 8px;color:#18cfff;text-shadow:0 0 18px #008cff}.sub{opacity:.8;margin-bottom:25px}.stage{height:min(68vw,420px);display:grid;place-items:center;perspective:900px}.spinner{width:min(68vw,360px);height:min(68vw,360px);position:relative;transform-style:preserve-3d;transition:transform 5s cubic-bezier(.12,.75,.08,1);filter:drop-shadow(0 22px 22px #000)}.spinner::after{content:"";position:absolute;left:50%;top:50%;width:31%;height:31%;transform:translate(-50%,-50%) translateZ(18px);border-radius:50%;background:radial-gradient(circle,#111 0 48%,#19cfff 50% 55%,#17202a 57% 100%);box-shadow:0 0 20px #00aaff}.arm{position:absolute;left:50%;top:50%;width:32%;height:48%;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(var(--a));border-radius:48% 48% 28% 28%;background:linear-gradient(145deg,#313b47,#080d13 58%,#26303b);border:3px solid #18bfff;box-shadow:inset 0 0 14px #000,0 0 12px #008cff;transform-style:preserve-3d}.arm:before{content:"";position:absolute;left:50%;top:8%;width:58%;aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle,#05070a 0 45%,#16bfff 47% 52%,#202833 54%);box-shadow:inset 0 0 10px #000}.arm:after{content:"";position:absolute;inset:15% 24% 30%;border-radius:30%;background:linear-gradient(90deg,transparent,#36d7ff33,transparent);filter:blur(2px)}button{border:0;border-radius:18px;padding:16px 58px;font-size:25px;font-weight:800;color:#fff;background:linear-gradient(180deg,#159fff,#0752b8);box-shadow:0 0 25px #008cffaa, inset 0 1px #ffffff66;cursor:pointer}button:active{transform:scale(.97)}.hint{margin-top:15px;opacity:.7;font-size:14px}.badge{display:inline-block;margin-top:16px;padding:7px 14px;border:1px solid #18bfff66;border-radius:20px;color:#8fe7ff;font-size:12px;letter-spacing:2px}
</style></head><body><main class="app"><h1>CJS NEXUS SPINNER</h1><div class="sub">CLICK SPIN TO ROTATE</div><div class="stage"><div id="spinner" class="spinner"><div class="arm" style="--a:0deg"></div><div class="arm" style="--a:120deg"></div><div class="arm" style="--a:240deg"></div></div></div><button id="spin">SPIN</button><div class="hint">हर click पर spinner तेजी से घूमेगा</div><div class="badge">3 EQUAL ARMS • 3D STYLE</div></main><script>
const s=document.getElementById('spinner'),b=document.getElementById('spin');let angle=0,turns=0;b.addEventListener('click',()=>{turns++;angle+=1440+Math.floor(Math.random()*4)*360+Math.floor(Math.random()*120);s.style.transform=`rotateZ(${angle}deg) rotateX(4deg)`;b.textContent='SPINNING…';setTimeout(()=>b.textContent='SPIN',4800)});s.addEventListener('click',()=>b.click());
</script></body></html>
