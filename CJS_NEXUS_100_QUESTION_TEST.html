function pick(i){document.querySelectorAll(`#q${i} .opt`).forEach(x=>x.classList.remove('selected'));const c=document.querySelector(`#q${i} input:checked`);if(c)c.parentElement.classList.add('selected');updateProgress();}
function updateProgress(){const answered=document.querySelectorAll('input[type=radio]:checked').length;document.getElementById('bar').style.width=(answered/100*100)+'%';}
let remaining=90*60;let submitted=false;
function tick(){if(submitted)return;let m=Math.floor(remaining/60),s=remaining%60;const t=document.getElementById('timer');t.textContent=`⏱️ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(remaining<=300)t.classList.add('warning');if(remaining<=0){submitTest(true);return;}remaining--;}
