<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CJS NEXUS 100 प्रश्न टेस्ट</title><style>
body{font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#eef2f7;margin:0;color:#17233c}.wrap{max-width:1000px;margin:auto;padding:18px}.head{background:#14294b;color:white;border-radius:16px;padding:20px;text-align:center;position:sticky;top:0;z-index:5}.head h1{margin:0 0 6px}.timer{font-size:22px;font-weight:700;margin-top:8px}.subject{background:#fff;border-left:6px solid #173866;border-radius:12px;margin:20px 0 10px;padding:12px 15px;font-size:20px;font-weight:700}.q{background:white;border-radius:12px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #0000000d}.qtitle{font-weight:700;line-height:1.55}.opt{display:block;padding:11px 12px;margin:8px 0;border:1px solid #ccd5e3;border-radius:9px;cursor:pointer}.opt:hover{background:#f2f6fb}.opt input{margin-right:8px}.submit{width:100%;padding:16px;border:0;border-radius:12px;background:#173866;color:white;font-size:20px;font-weight:700;cursor:pointer;margin:20px 0}.result{display:none;background:white;border-radius:16px;padding:20px;box-shadow:0 3px 15px #0002}.scoretable{width:100%;border-collapse:collapse;margin:15px 0}.scoretable th{background:#14294b;color:white}.scoretable th,.scoretable td{padding:11px;border:1px solid #c8d0dc;text-align:center}.review{margin-top:20px}.r{border:1px solid #d5dce7;border-radius:10px;padding:12px;margin:10px 0}.correct{background:#eaf8ee;border-left:5px solid #16833d}.wrong{background:#fff0f0;border-left:5px solid #c62828}.detail{margin-top:7px;color:#334}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf2f8;margin:2px}.topscore{text-align:center;font-size:26px;font-weight:800}.small{font-size:13px;color:#5c6675}</style></head><body><div class="wrap"><div class="head"><h1>CJS NEXUS — 100 प्रश्न टेस्ट</h1><div>हिंदी माध्यम • 100 अंक • 90 मिनट</div><div class="timer" id="timer">90:00</div></div><form id="test"></form><button class="submit" id="submit">SUBMIT TEST</button><section class="result" id="result"></section></div><script>
const questions=[{"sub": "गणित", "q": "एक राशि 20% बढ़ाकर फिर 20% घटाई जाती है। शुद्ध परिवर्तन क्या होगा?", "opts": ["4% वृद्धि", "4% कमी", "0%", "2% कमी"], "ans": 1, "detail": "1.20×0.80=0.96, इसलिए मूल राशि की 4% कमी होती है."}, {"sub": "गणित", "q": "यदि x + 1/x = 5, तो x² + 1/x² का मान क्या है?", "opts": ["21", "23", "25", "27"], "ans": 1, "detail": "वर्ग करने पर x²+2+1/x²=25, अतः मान 23."}, {"sub": "गणित", "q": "दो संख्याओं का HCF 12 और LCM 420 है। यदि एक संख्या 60 है, तो दूसरी संख्या?", "opts": ["72", "84", "96", "108"], "ans": 1, "detail": "दो संख्याओं का गुणनफल = HCF×LCM = 5040; दूसरी = 5040/60=84."}, {"sub": "गणित", "q": "एक पाइप टंकी को 12 घंटे में भरता है और दूसरा 18 घंटे में। दोनों साथ में कितने घंटे लेंगे?", "opts": ["6 घंटे", "7 घंटे 12 मिनट", "8 घंटे", "9 घंटे"], "ans": 1, "detail": "संयुक्त दर=1/12+1/18=5/36; समय=36/5=7.2 घंटे=7 घंटे 12 मिनट."}, {"sub": "गणित", "q": "एक ट्रेन 72 km/h से चलकर 250 m लंबे प्लेटफॉर्म को 25 सेकंड में पार करती है। ट्रेन की लंबाई कितनी है?", "opts": ["200 m", "225 m", "250 m", "300 m"], "ans": 2, "detail": "72 km/h=20 m/s; कुल दूरी=20×25=500m; ट्रेन=500−250=250m. सही उत्तर 250m है।"}, {"sub": "गणित", "q": "किसी वस्तु पर 20% और 10% की क्रमिक छूट दी गई। कुल समतुल्य छूट?", "opts": ["28%", "30%", "32%", "18%"], "ans": 0, "detail": "अंतिम मूल्य=0.8×0.9=0.72, इसलिए कुल छूट 28%."}, {"sub": "गणित", "q": "₹8000 पर 10% वार्षिक चक्रवृद्धि ब्याज से 2 वर्ष बाद राशि क्या होगी?", "opts": ["₹9600", "₹9680", "₹9800", "₹9920"], "ans": 1, "detail": "A=8000×(1.1)²=₹9680."}, {"sub": "गणित", "q": "एक आयत का क्षेत्रफल 384 cm² और लंबाई:चौड़ाई=3:2 है। परिमाप?", "opts": ["72 cm", "76 cm", "80 cm", "84 cm"], "ans": 2, "detail": "3k×2k=6k²=384 ⇒ k=8; भुजाएँ 24,16; परिमाप=80cm."}, {"sub": "गणित", "q": "यदि 3x−5=2x+11, तो x²−x का मान?", "opts": ["240", "255", "272", "289"], "ans": 0, "detail": "x=16; x²−x=256−16=240. सही विकल्प 240 है।"}, {"sub": "गणित", "q": "एक संख्या को 7 से भाग देने पर शेष 5 आता है। उसी संख्या के 3 गुने को 7 से भाग देने पर शेष?", "opts": ["1", "2", "3", "4"], "ans": 3, "detail": "3×5=15 और 15 को 7 से भाग देने पर शेष 1. सही विकल्प 1 है।"}, {"sub": "गणित", "q": "A और B की आयु का अनुपात 4:5 है। 6 वर्ष बाद अनुपात 5:6 होगा। A की वर्तमान आयु?", "opts": ["18", "20", "24", "30"], "ans": 2, "detail": "4x+6 : 5x+6 =5:6 ⇒24x+36=25x+30 ⇒ x=6; A=24."}, {"sub": "गणित", "q": "एक नाव स्थिर जल में 12 km/h और धारा 3 km/h है। 45 km धारा के विरुद्ध जाने में समय?", "opts": ["3 घंटे", "4 घंटे", "5 घंटे", "6 घंटे"], "ans": 1, "detail": "Upstream speed=12−3=9 km/h; time=45/9=5 घंटे. सही विकल्प 5 घंटे है।"}, {"sub": "गणित", "q": "यदि sin θ=3/5 और θ तीव्र कोण है, तो tan θ?", "opts": ["3/4", "4/3", "5/3", "5/4"], "ans": 0, "detail": "cosθ=4/5, इसलिए tanθ=(3/5)/(4/5)=3/4."}, {"sub": "गणित", "q": "एक समकोण त्रिभुज की लम्ब भुजाएँ 9 और 12 हैं। अंतःवृत्त की त्रिज्या?", "opts": ["2", "3", "4", "5"], "ans": 1, "detail": "कर्ण=15; r=(a+b−c)/2=(9+12−15)/2=3."}, {"sub": "गणित", "q": "यदि log₂x=5, तो log₄x का मान?", "opts": ["2", "2.5", "5", "10"], "ans": 1, "detail": "log₄x = log₂x/log₂4 =5/2=2.5."}, {"sub": "गणित", "q": "एक वर्ग की भुजा 20% बढ़े तो क्षेत्रफल कितने प्रतिशत बढ़ेगा?", "opts": ["20%", "40%", "44%", "48%"], "ans": 2, "detail": "नई भुजा 1.2a; क्षेत्रफल 1.44a², यानी 44% वृद्धि."}, {"sub": "गणित", "q": "एक दुकानदार 15% लाभ पर वस्तु बेचता है। यदि लागत 20% बढ़ जाए और विक्रय मूल्य वही रहे, नया लाभ/हानि?", "opts": ["4.17% लाभ", "4.17% हानि", "5% लाभ", "5% हानि"], "ans": 1, "detail": "मूल CP=100, SP=115; नया CP=120; हानि=5/120×100=4.17%."}, {"sub": "गणित", "q": "औसत 8 संख्याओं का 24 है। एक संख्या हटाने पर औसत 22 हो जाता है। हटाई गई संख्या?", "opts": ["32", "36", "38", "40"], "ans": 2, "detail": "कुल=192; शेष 7 का योग=154; हटाई संख्या=38."}, {"sub": "गणित", "q": "यदि a:b=2:3 और b:c=4:5, तो a:c?", "opts": ["8:15", "2:5", "4:15", "3:10"], "ans": 0, "detail": "a:b=8:12 और b:c=12:15, इसलिए a:c=8:15."}, {"sub": "गणित", "q": "एक राशि 3 वर्षों में साधारण ब्याज पर 1.24 गुना हो जाती है। वार्षिक दर?", "opts": ["6%", "8%", "10%", "12%"], "ans": 1, "detail": "SI=0.24P=PRT/100; R=24/3=8%."}, {"sub": "रीजनिंग", "q": "श्रृंखला: 3, 8, 18, 38, 78, ?", "opts": ["156", "158", "160", "162"], "ans": 1, "detail": "हर बार ×2+2: 3→8→18→38→78→158."}, {"sub": "रीजनिंग", "q": "यदि TABLE को UBCMF लिखा जाए, तो CHAIR कैसे लिखा जाएगा?", "opts": ["DIBJS", "DIBIR", "DHBJS", "EIBJS"], "ans": 0, "detail": "हर अक्षर में 1 जोड़ा गया: C→D,H→I,A→B,I→J,R→S."}, {"sub": "रीजनिंग", "q": "एक व्यक्ति दक्षिण की ओर 8m, बाएँ 6m, फिर उत्तर 8m चलता है। प्रारंभ से उसकी दूरी और दिशा?", "opts": ["6m पूर्व", "6m पश्चिम", "8m पूर्व", "8m पश्चिम"], "ans": 1, "detail": "दक्षिण और उत्तर की चाल cancel; बाएँ मुड़ने पर पूर्वाभिमुख व्यक्ति के लिए पश्चिम दिशा में 6m बचता है."}, {"sub": "रीजनिंग", "q": "कथन: सभी कवि स्वप्नदर्शी हैं। कुछ स्वप्नदर्शी शिक्षक हैं। निश्चित निष्कर्ष?", "opts": ["कुछ कवि शिक्षक हैं", "सभी शिक्षक कवि हैं", "सभी कवि स्वप्नदर्शी हैं", "कोई शिक्षक स्वप्नदर्शी नहीं"], "ans": 2, "detail": "पहला कथन ही निश्चित निष्कर्ष है; दूसरे से कवियों और शिक्षकों का overlap निश्चित नहीं."}, {"sub": "रीजनिंग", "q": "एक पंक्ति में A बाएँ से 17वाँ और B दाएँ से 21वाँ है। यदि A, B से 9 स्थान बाएँ है, तो कुल व्यक्ति?", "opts": ["45", "46", "47", "48"], "ans": 1, "detail": "B का बायाँ स्थान=17+9=26; कुल=26+21−1=46. सही विकल्प 46 है।"}, {"sub": "रीजनिंग", "q": "श्रृंखला: 2, 5, 11, 23, 47, ?", "opts": ["93", "94", "95", "96"], "ans": 2, "detail": "हर पद = पिछले×2+1; अगला 95."}, {"sub": "रीजनिंग", "q": "यदि किसी शब्द के अक्षरों को उल्टे वर्णक्रम में बदला जाए, तो BAD का कोड? (A↔Z, B↔Y, …)", "opts": ["YZ W", "YW W", "YZW", "XZW"], "ans": 2, "detail": "B→Y, A→Z, D→W; कोड YZW."}, {"sub": "रीजनिंग", "q": "P, Q का पिता है; R, Q की बहन है; S, R की माँ है। P का S से संबंध?", "opts": ["भाई", "पति", "पिता", "पुत्र"], "ans": 1, "detail": "P, Q का पिता और R, Q की बहन; S, R की माँ अर्थात P और S पति-पत्नी हैं."}, {"sub": "रीजनिंग", "q": "विषम चुनें: 27, 64, 125, 216, 343, 500", "opts": ["27", "64", "343", "500"], "ans": 3, "detail": "पहले पाँच क्रमशः 3³,4³,5³,6³,7³ हैं; 500 पूर्ण घन नहीं."}, {"sub": "रीजनिंग", "q": "यदि आज सोमवार है, तो 61 दिन बाद कौन-सा दिन होगा?", "opts": ["गुरुवार", "शुक्रवार", "शनिवार", "रविवार"], "ans": 2, "detail": "61 mod 7=5; सोमवार+5=शनिवार. सही विकल्प शनिवार है।"}, {"sub": "रीजनिंग", "q": "एक कोड में MANGO=13-1-14-7-15 है। उसी नियम से GRAPE?", "opts": ["7-18-1-16-5", "7-17-1-16-5", "6-18-1-16-5", "7-18-2-16-5"], "ans": 0, "detail": "हर अक्षर का alphabet position: G7,R18,A1,P16,E5."}, {"sub": "रीजनिंग", "q": "श्रृंखला: AB, DE, GH, JK, ?", "opts": ["LM", "MN", "NO", "OP"], "ans": 1, "detail": "प्रत्येक जोड़ी 3 अक्षर आगे शुरू होती है: A,D,G,J,M; इसलिए MN."}, {"sub": "रीजनिंग", "q": "यदि 1 जनवरी किसी वर्ष को मंगलवार है और वह leap year है, तो 1 मार्च कौन-सा दिन होगा?", "opts": ["गुरुवार", "शुक्रवार", "शनिवार", "रविवार"], "ans": 2, "detail": "जनवरी 31 दिन और फरवरी 29; कुल 60 दिन ≡4 mod7; मंगलवार+4=शनिवार. सही विकल्प शनिवार है।"}, {"sub": "रीजनिंग", "q": "एक घड़ी 5 मिनट में 2 मिनट तेज होती है। 1 घंटे में वह वास्तविक समय से कितनी तेज होगी?", "opts": ["12 मिनट", "18 मिनट", "24 मिनट", "30 मिनट"], "ans": 2, "detail": "हर 5 वास्तविक मिनट में 2 मिनट gain; 60 में gain=24 मिनट."}, {"sub": "रीजनिंग", "q": "यदि A>B, B=C, C>D, तो निश्चित रूप से?", "opts": ["A<D", "A>D", "B>D नहीं", "D>A"], "ans": 1, "detail": "A>B=C>D से A>D निश्चित है."}, {"sub": "रीजनिंग", "q": "छह लोग A,B,C,D,E,F एक पंक्ति में हैं। A, B के ठीक बाएँ; C, D के ठीक दाएँ; E एक छोर पर है। कौन-सी व्यवस्था संभव है?", "opts": ["E A B F D C", "A B E C D F", "F A B D C E", "B A F D C E"], "ans": 2, "detail": "F-A-B-D-C-E सभी शर्तें पूरी करता है; E छोर पर है, A-B और D-C जोड़े हैं."}, {"sub": "रीजनिंग", "q": "दर्पण में 2:20 का समय कैसा दिखेगा?", "opts": ["9:40", "8:40", "9:20", "10:40"], "ans": 0, "detail": "Mirror time = 11:60−2:20=9:40."}, {"sub": "रीजनिंग", "q": "यदि SOME को TPNF लिखा जाए, तो LOGIC का कोड?", "opts": ["MPHJD", "MPHJB", "KPHJD", "MPGJD"], "ans": 0, "detail": "हर अक्षर में 1: L→M,O→P,G→H,I→J,C→D."}, {"sub": "रीजनिंग", "q": "एक कक्षा में Ravi ऊपर से 13वाँ और नीचे से 18वाँ है। कुल विद्यार्थी?", "opts": ["29", "30", "31", "32"], "ans": 1, "detail": "कुल=13+18−1=30."}, {"sub": "रीजनिंग", "q": "यदि सभी A, B हैं और कोई B, C नहीं है, तो क्या निश्चित है?", "opts": ["कुछ A, C हैं", "कोई A, C नहीं है", "सभी C, A हैं", "कुछ B, A हैं"], "ans": 1, "detail": "A⊆B और B∩C=∅ ⇒ A∩C=∅."}, {"sub": "सामान्य ज्ञान", "q": "भारतीय संविधान में “मूल संरचना सिद्धांत” किस मामले से जुड़ा है?", "opts": ["गोलकनाथ", "केशवानंद भारती", "मेनका गांधी", "मिनर्वा मिल्स"], "ans": 1, "detail": "Kesavananda Bharati v. State of Kerala (1973) में Supreme Court ने basic structure doctrine प्रतिपादित किया."}, {"sub": "सामान्य ज्ञान", "q": "संविधान का अनुच्छेद 32 किससे संबंधित है?", "opts": ["समानता", "संवैधानिक उपचार", "धर्म की स्वतंत्रता", "शिक्षा"], "ans": 1, "detail": "Article 32 मौलिक अधिकारों के प्रवर्तन के लिए Supreme Court जाने का अधिकार देता है."}, {"sub": "सामान्य ज्ञान", "q": "वित्त आयोग का गठन संविधान के किस अनुच्छेद के तहत होता है?", "opts": ["280", "281", "275", "324"], "ans": 0, "detail": "अनुच्छेद 280 के तहत राष्ट्रपति वित्त आयोग का गठन करते हैं."}, {"sub": "सामान्य ज्ञान", "q": "राज्यसभा में राज्यों के प्रतिनिधियों का चुनाव किस पद्धति से होता है?", "opts": ["प्रत्यक्ष बहुमत", "एकल संक्रमणीय मत द्वारा आनुपातिक प्रतिनिधित्व", "लॉटरी", "नामांकन"], "ans": 1, "detail": "निर्वाचित राज्य विधानसभाओं के सदस्य STV द्वारा proportional representation से चुनाव करते हैं."}, {"sub": "सामान्य ज्ञान", "q": "भारत में धन विधेयक को प्रमाणित करने का अंतिम अधिकार किसके पास है?", "opts": ["राष्ट्रपति", "राज्यसभा सभापति", "लोकसभा अध्यक्ष", "प्रधानमंत्री"], "ans": 2, "detail": "Money Bill है या नहीं, इसका प्रमाणन लोकसभा अध्यक्ष करते हैं."}, {"sub": "सामान्य ज्ञान", "q": "सिंधु सभ्यता का कौन-सा स्थल dockyard के लिए प्रसिद्ध है?", "opts": ["कालीबंगा", "लोथल", "धोलावीरा", "राखीगढ़ी"], "ans": 1, "detail": "लोथल (गुजरात) का प्राचीन dockyard समुद्री व्यापार का महत्वपूर्ण प्रमाण है."}, {"sub": "सामान्य ज्ञान", "q": "अशोक के शिलालेखों में प्रयुक्त प्रमुख लिपि कौन-सी थी?", "opts": ["देवनागरी", "ब्राह्मी", "शारदा", "ग्रंथ"], "ans": 1, "detail": "अधिकांश अशोक अभिलेख ब्राह्मी में हैं; उत्तर-पश्चिम में खरोष्ठी भी प्रयुक्त हुई."}, {"sub": "सामान्य ज्ञान", "q": "इलाहाबाद स्तंभ प्रशस्ति किस गुप्त शासक से संबंधित है?", "opts": ["चंद्रगुप्त I", "समुद्रगुप्त", "चंद्रगुप्त II", "स्कंदगुप्त"], "ans": 1, "detail": "हरिषेण द्वारा रचित प्रयाग/इलाहाबाद प्रशस्ति समुद्रगुप्त की उपलब्धियों का वर्णन करती है."}, {"sub": "सामान्य ज्ञान", "q": "भारत में हरित क्रांति का सबसे अधिक प्रभाव प्रारंभिक चरण में किस फसल पर पड़ा?", "opts": ["चाय", "गेहूँ", "कपास", "जूट"], "ans": 1, "detail": "उच्च उपज वाली किस्मों और सिंचाई के विस्तार से गेहूँ उत्पादन में विशेष उछाल आया."}, {"sub": "सामान्य ज्ञान", "q": "कर्क रेखा भारत के कितने राज्यों से होकर गुजरती है?", "opts": ["6", "7", "8", "9"], "ans": 2, "detail": "कर्क रेखा भारत के 8 राज्यों से होकर गुजरती है."}, {"sub": "सामान्य ज्ञान", "q": "भारतीय मानसून के आगमन में किस शाखा का प्रमुख योगदान केरल तट पर होता है?", "opts": ["अरब सागर शाखा", "बंगाल की खाड़ी शाखा", "पश्चिमी विक्षोभ", "भूमध्यसागरीय शाखा"], "ans": 0, "detail": "दक्षिण-पश्चिम मानसून की Arabian Sea branch केरल तट पर प्रवेश करती है."}, {"sub": "सामान्य ज्ञान", "q": "नर्मदा और ताप्ती नदियाँ सामान्यतः किस दिशा में बहकर समुद्र में मिलती हैं?", "opts": ["पूर्व", "पश्चिम", "उत्तर", "दक्षिण"], "ans": 1, "detail": "दोनों प्रमुख प्रायद्वीपीय नदियाँ भ्रंश घाटियों से पश्चिम की ओर बहकर अरब सागर में गिरती हैं."}, {"sub": "सामान्य ज्ञान", "q": "भारत का सबसे बड़ा खारे पानी का लैगून कौन-सा है?", "opts": ["पुलिकट", "चिलिका", "वेम्बनाड", "कोल्लेरू"], "ans": 1, "detail": "ओडिशा की Chilika Lake भारत का सबसे बड़ा brackish water lagoon है."}, {"sub": "सामान्य ज्ञान", "q": "संविधान की आठवीं अनुसूची में वर्तमान में कितनी भाषाएँ हैं?", "opts": ["18", "20", "22", "24"], "ans": 2, "detail": "आठवीं अनुसूची में 22 भाषाएँ सूचीबद्ध हैं."}, {"sub": "सामान्य ज्ञान", "q": "भारत का नियंत्रक एवं महालेखा परीक्षक किस अनुच्छेद से संबंधित है?", "opts": ["148", "149", "150", "151"], "ans": 0, "det questions.forEach((x,i)=>{if(x.sub!==lastSub){let s=document.createElement('div');s.className='subject';s.textContent=x.sub+' — 20 प्रश्न';form.appendChild(s);lastSub=x.sub;} let d=document.createElement('div');d.className='q';d.innerHTML='<div class="qtitle">'+(i+1)+'. '+x.q+'</div>'+x.opts.map((o,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"> <b>'+labels[j]+'.</b> '+o+'</label>').join('');form.appendChild(d);});
function tick(){if(ended)return;let m=Math.floor(time/60),s=time%60;timerEl.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(time<=0){finish(true);return}time--;} setInterval(tick,1000); tick();
function finish(auto=false){if(ended)return;ended=true;let score=0, sub={}; questions.forEach((x,i)=>{if(!sub[x.sub])sub[x.sub]={max:0,got:0};sub[x.sub].max++;let sel=document.querySelector('input[name=q'+i+']:checked');if(sel&&+sel.value===x.ans){score++;sub[x.sub].got++;}}); let pct=score; let grade=pct>=90?'A+':pct>=80?'A':pct>=70?'B+':pct>=60?'B':pct>=50?'C':'D'; let rows=Object.entries(sub).map(([k,v])=>'<tr><td>'+k+'</td><td>20</td><td><b>'+v.got+'</b></td></tr>').join(''); let review=questions.map((x,i)=>{let sel=document.querySelector('input[name=q'+i+']:checked');let ua=sel?x.opts[+sel.value]:'उत्तर नहीं दिया';let ok=sel&&+sel.value===x.ans;return '<div class="r '+(ok?'correct':'wrong')+'"><b>'+(i+1)+'. '+x.q+'</b><div><span class="badge">आपका उत्तर: '+ua+'</span> <span class="badge">सही उत्तर: '+labels[x.ans]+'. '+x.opts[x.ans]+'</span></div><div class="detail"><b>विस्तृत जानकारी:</b> '+x.detail+'</div></div>';}).join(''); let res=document.getElementById('result');res.style.display='block';res.innerHTML='<div class="topscore">आपका स्कोर: '+score+' / 100</div><p style="text-align:center">प्रतिशत: <b>'+pct+'%</b> &nbsp; | &nbsp; ग्रेड: <b>'+grade+'</b></p><table class="scoretable"><thead><tr><th>SUBJECT</th><th>MAXIMUM MARKS</th><th>MARKS OBTAINED</th></tr></thead><tbody>'+rows+'<tr><th>TOTAL</th><th>100</th><th>'+score+'</th></tr></tbody></table><h2>सभी प्रश्नों के सही उत्तर और विवरण</h2><div class="review">'+review+'</div>'+(auto?'<p><b>समय समाप्त हो गया था, इसलिए टेस्ट स्वतः submit किया गया।</b></p>':'');form.style.display='none';submit.style.display='none';res.scrollIntoView({behavior:'smooth'});}
submit.addEventListener('click',e=>{e.preventDefault();if(confirm('क्या आप टेस्ट submit करना चाहते हैं?'))finish(false);});
</script></body></html>
